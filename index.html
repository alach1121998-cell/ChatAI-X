<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatAI X</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 16px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 15px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    textarea {
      width: 100%;
      min-height: 110px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 12px;
      resize: vertical;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    button:disabled {
      opacity: .6;
    }

    .result {
      margin-top: 15px;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    img {
      width: 100%;
      margin-top: 15px;
      border-radius: 14px;
      display: none;
    }

    .status {
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  🤖 ChatAI X
</header>

<div class="container">

  <!-- CHAT -->
  <div class="card">
    <h2>💬 Chat AI</h2>

    <textarea
      id="chatInput"
      placeholder="Nhập câu hỏi..."
    ></textarea>

    <button id="chatButton" onclick="sendChat()">
      Gửi
    </button>

    <div id="chatStatus" class="status"></div>
    <div id="chatResult" class="result"></div>
  </div>

  <!-- IMAGE -->
  <div class="card">
    <h2>🖼️ Tạo ảnh AI</h2>

    <textarea
      id="imagePrompt"
      placeholder="Ví dụ: Tạo một cô gái H'Mông đứng giữa ruộng hoa, ảnh chân thực, điện ảnh, 9:16..."
    ></textarea>

    <button id="imageButton" onclick="generateImage()">
      🖼️ Tạo ảnh
    </button>

    <div id="imageStatus" class="status"></div>

    <img id="generatedImage" alt="Ảnh AI">
  </div>

</div>

<script>

async function sendChat() {

  const input = document.getElementById("chatInput");
  const result = document.getElementById("chatResult");
  const status = document.getElementById("chatStatus");
  const button = document.getElementById("chatButton");

  const message = input.value.trim();

  if (!message) {
    status.textContent = "❌ Hãy nhập tin nhắn.";
    return;
  }

  button.disabled = true;
  status.textContent = "⏳ AI đang suy nghĩ...";
  result.textContent = "";

  try {

    const response = await fetch("/api/chat", {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: message
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "Chat API lỗi " + response.status
      );
    }

    result.textContent =
      data.reply || "AI không trả lời.";

    status.textContent = "✅ Hoàn thành";

  } catch (error) {

    status.textContent =
      "❌ Lỗi: " + error.message;

  } finally {

    button.disabled = false;

  }
}


async function generateImage() {

  const prompt =
    document.getElementById("imagePrompt").value.trim();

  const status =
    document.getElementById("imageStatus");

  const image =
    document.getElementById("generatedImage");

  const button =
    document.getElementById("imageButton");

  if (!prompt) {

    status.textContent =
      "❌ Hãy nhập mô tả ảnh.";

    return;
  }

  button.disabled = true;

  image.style.display = "none";

  status.textContent =
    "⏳ Đang tạo ảnh AI...";

  try {

    const response = await fetch("/api/image", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        prompt: prompt
      })

    });

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.error ||
        "Image API lỗi " +
        response.status
      );

    }

    if (!data.image) {

      throw new Error(
        "API không trả về ảnh."
      );

    }

    image.src =
      "data:image/png;base64," +
      data.image;

    image.style.display =
      "block";

    status.textContent =
      "✅ Đã tạo ảnh!";

  } catch (error) {

    status.textContent =
      "❌ Lỗi: " +
      error.message;

  } finally {

    button.disabled = false;

  }

}

</script>

</body>
</html>
