<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatAI X</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fff;color:#222}
.app{display:flex;height:100vh}
.sidebar{width:260px;background:#f7f7f8;padding:15px;border-right:1px solid #ddd}
.logo{font-size:22px;font-weight:bold;margin-bottom:20px}
.new{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;background:white}
.menu{margin-top:20px}
.menu button{display:block;width:100%;padding:13px;margin:6px 0;border:0;background:transparent;text-align:left;border-radius:9px;font-size:15px}
.menu button:hover{background:#e9e9e9}
.main{flex:1;display:flex;flex-direction:column}
.header{height:60px;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 20px;font-weight:bold}
.chat{flex:1;overflow:auto;padding:25px}
.welcome{text-align:center;margin-top:15vh}
.welcome h1{font-size:32px}
.input-area{padding:15px;border-top:1px solid #ddd}
.box{max-width:800px;margin:auto;border:1px solid #ccc;border-radius:16px;padding:10px;display:flex;gap:8px}
textarea{flex:1;border:0;outline:0;resize:none;font-size:16px;padding:8px}
.btn{border:0;border-radius:10px;padding:10px 13px;background:#111;color:white}
.attach{background:#eee;color:#222}
#files{display:none}
@media(max-width:700px){
.sidebar{display:none}
.welcome h1{font-size:26px}
}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar">
<div class="logo">✦ ChatAI X</div>

<button class="new" onclick="newChat()">＋ Cuộc trò chuyện mới</button>

<div class="menu">
<button onclick="selectMode('chat')">💬 Trò chuyện</button>
<button onclick="selectMode('image')">🖼️ Tạo & sửa ảnh</button>
<button onclick="selectMode('video')">🎬 Tạo video</button>
<button onclick="selectMode('music')">🎵 Tạo nhạc H'Mông</button>
<button onclick="selectMode('project')">🎭 Dự án sáng tạo</button>
</div>
</aside>

<main class="main">

<header class="header">
<span id="modeTitle">ChatAI X</span>
</header>

<section class="chat" id="chat">
<div class="welcome">
<h1>Chào mừng đến với ChatAI X</h1>
<p>Bạn muốn tạo gì hôm nay?</p>
</div>
</section>

<div class="input-area">
<div class="box">

<label class="btn attach" for="files">📎</label>
<input id="files" type="file" accept="image/*" multiple onchange="showFiles()">

<textarea id="prompt" rows="1"
placeholder="Nhập yêu cầu của bạn..."></textarea>

<button class="btn" onclick="sendMessage()">➤</button>

</div>

<div id="fileInfo" style="max-width:800px;margin:7px auto;font-size:13px;color:#666"></div>
</div>

</main>
</div>

<script>
let mode="chat";

function selectMode(type){
mode=type;

const titles={
chat:"💬 Trò chuyện",
image:"🖼️ Tạo & sửa ảnh",
video:"🎬 Tạo video",
music:"🎵 Tạo nhạc H'Mông",
project:"🎭 Dự án sáng tạo"
};

document.getElementById("modeTitle").innerText=titles[type];

const prompts={
chat:"Bạn muốn hỏi gì?",
image:"Ví dụ: Thay trang phục trong ảnh 2 cho cô gái ở ảnh 1...",
video:"Mô tả video bạn muốn tạo...",
music:"Ví dụ: Tạo một bài nhạc H'Mông buồn về tình yêu...",
project:"Gửi nhiều ảnh tham chiếu và mô tả dự án bạn muốn tạo..."
};

document.getElementById("prompt").placeholder=prompts[type];
}

function newChat(){
document.getElementById("chat").innerHTML=
'<div class="welcome"><h1>ChatAI X</h1><p>Bạn muốn tạo gì hôm nay?</p></div>';
}

function showFiles(){
const files=document.getElementById("files").files;
document.getElementById("fileInfo").innerText=
files.length ? "📸 Đã chọn "+files.length+" ảnh tham chiếu" : "";
}

function sendMessage(){

const input=document.getElementById("prompt");
const text=input.value.trim();

if(!text && !document.getElementById("files").files.length)return;

const chat=document.getElementById("chat");

const user=document.createElement("div");
user.style.margin="20px auto";
user.style.maxWidth="800px";
user.innerHTML="<b>Bạn:</b><br>"+escapeHtml(text);
chat.appendChild(user);

const ai=document.createElement("div");
ai.style.margin="20px auto";
ai.style.maxWidth="800px";

let reply="";

if(mode==="chat"){
reply="🤖 ChatAI X đã nhận yêu cầu. Chức năng AI sẽ được kết nối ở bước tiếp theo.";
}

if(mode==="image"){
reply="🖼️ Chế độ chỉnh ảnh đã sẵn sàng. Bạn có thể gửi nhiều ảnh tham chiếu để yêu cầu thay khuôn mặt, trang phục hoặc bối cảnh.";
}

if(mode==="video"){
reply="🎬 Chế độ tạo video đã sẵn sàng. Sau khi kết nối API video, ChatAI X sẽ có thể tạo video từ mô tả hoặc ảnh.";
}

if(mode==="music"){
reply="🎵 Chế độ tạo nhạc H'Mông đã sẵn sàng. Sau khi kết nối API âm nhạc, bạn có thể tạo lời, nhạc nền và giọng hát.";
}

if(mode==="project"){
reply="🎭 Chế độ Dự án sáng tạo đã sẵn sàng. ChatAI X sẽ phân tích nhiều ảnh tham chiếu rồi tự xây dựng nhân vật, cốt truyện, kịch bản và từng cảnh.";
}

ai.innerHTML=reply;
chat.appendChild(ai);

input.value="";
chat.scrollTop=chat.scrollHeight;
}

function escapeHtml(text){
return text.replace(/[&<>"']/g,function(m){
return ({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m]);
});
}
</script>

</body>
</html>
