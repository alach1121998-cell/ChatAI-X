<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChatAI X</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fff;color:#222}
.app{display:flex;height:100vh}
.sidebar{width:250px;background:#f7f7f8;border-right:1px solid #ddd;padding:14px}
.logo{font-size:22px;font-weight:700;margin-bottom:18px}
.new{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;background:#fff}
.menu{margin-top:18px}
.menu button{width:100%;padding:13px;margin:4px 0;border:0;border-radius:9px;background:transparent;text-align:left;font-size:15px}
.menu button:hover{background:#e8e8e8}
.main{flex:1;display:flex;flex-direction:column}
.header{height:60px;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 20px;font-weight:bold}
.chat{flex:1;overflow:auto;padding:20px}
.welcome{text-align:center;margin-top:15vh}
.msg{max-width:800px;margin:18px auto;line-height:1.5}
.user{font-weight:bold}
.ai{background:#f7f7f8;padding:14px;border-radius:12px}
.input-area{padding:14px;border-top:1px solid #ddd}
.box{max-width:800px;margin:auto;border:1px solid #bbb;border-radius:16px;padding:8px;display:flex;gap:7px}
textarea{flex:1;border:0;outline:0;resize:none;padding:9px;font-size:16px}
.btn{border:0;border-radius:10px;padding:10px 13px;background:#111;color:#fff}
.attach{background:#eee;color:#222}
#files{display:none}
@media(max-width:700px){.sidebar{display:none}}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar">
<div class="logo">✦ ChatAI X</div>

<button class="new" onclick="newChat()">＋ Cuộc trò chuyện mới</button>

<div class="menu">
<button onclick="mode('chat')">💬 Trò chuyện</button>
<button onclick="mode('image')">🖼️ Tạo & sửa ảnh</button>
<button onclick="mode('video')">🎬 Tạo video</button>
<button onclick="mode('music')">🎵 Tạo nhạc H'Mông</button>
<button onclick="mode('project')">🎭 Dự án sáng tạo</button>
</div>
</aside>

<main class="main">

<header class="header">
<span id="title">ChatAI X</span>
</header>

<section class="chat" id="chat">
<div class="welcome">
<h1>Chào mừng đến với ChatAI X</h1>
<p>Bạn muốn tạo gì hôm nay?</p>
</div>
</section>

<div class="input-area">
<div class="box">

<label class="btn attach" for="files">📎</label>
<input id="files" type="file" accept="image/*" multiple>

<textarea id="prompt" rows="1"
placeholder="Nhập tin nhắn..."></textarea>

<button class="btn" onclick="sendMessage()">➤</button>

</div>

<div id="fileInfo"></div>
</div>

</main>
</div>

<script>
let currentMode="chat";

function mode(type){
currentMode=type;

const names={
chat:"💬 Trò chuyện",
image:"🖼️ Tạo & sửa ảnh",
video:"🎬 Tạo video",
music:"🎵 Tạo nhạc H'Mông",
project:"🎭 Dự án sáng tạo"
};

document.getElementById("title").textContent=names[type];
}

document.getElementById("files").addEventListener("change",function(){
document.getElementById("fileInfo").textContent=
this.files.length+" ảnh tham chiếu đã chọn";
});

function newChat(){
document.getElementById("chat").innerHTML=
'<div class="welcome"><h1>ChatAI X</h1><p>Bạn muốn tạo gì hôm nay?</p></div>';
}

async function sendMessage(){

const input=document.getElementById("prompt");
const text=input.value.trim();

if(!text)return;

const chat=document.getElementById("chat");

const user=document.createElement("div");
user.className="msg";
user.innerHTML="<div class='user'>Bạn</div><div>"+escapeHtml(text)+"</div>";
chat.appendChild(user);

const ai=document.createElement("div");
ai.className="msg ai";
ai.textContent="⏳ ChatAI X đang suy nghĩ...";
chat.appendChild(ai);

input.value="";
chat.scrollTop=chat.scrollHeight;

try{

const response=await fetch("/api/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({message:text})
});

const data=await response.json();

if(!response.ok){
throw new Error(data.error || "Lỗi máy chủ");
}

ai.textContent=data.reply || "Không nhận được câu trả lời.";

}catch(error){

ai.textContent="❌ Lỗi: "+error.message;

}

chat.scrollTop=chat.scrollHeight;
}

function escapeHtml(text){
const div=document.createElement("div");
div.textContent=text;
return div.innerHTML;
}
</script>

</body>
</html>
